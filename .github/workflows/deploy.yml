name: Deploy Backend
on:
  push:
    branches:
      - production
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-backend:buildcache,mode=max
          
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to server
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
            cd /opt/ai-hype
            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
            export BACKEND_VERSION="${GITHUB_SHA}"
            export FRONTEND_VERSION=\$([ -f frontend_version.txt ] && cat frontend_version.txt || echo "latest")
            echo "${GITHUB_SHA}" > backend_version.txt
            docker pull ${DOCKERHUB_USERNAME}/ai-hype-backend:${GITHUB_SHA}
            docker compose up -d backend
            docker image prune -f
          EOF
          
      - name: Run migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            docker exec ai-hype-backend-1 python manage.py migrate --noinput || true
          EOF
          
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key